<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            /* flex-direction: column; */
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 250px;
            border: 3px solid #f6e0b5;
            border-radius: 8px;
            overflow: hidden;
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            background: #66545e;
            display: flex;
            align-items: center;
        }
        .Card img {
            width: 100%;
            height: 17rem;
        }
        .Card .AddToCart {
            display: flex;
            gap: 10px;
            padding-bottom: 10px;
            margin-top: 10px;
        }
        .Card .AddToCart button {
            width: 13rem;
            background-color: #aa6f73;
            transition: background-color 0.3s ease;
        }
        .Card .buy {
            display: flex;
            gap: 40px;
            justify-content: space-around;
        }
        .Card .buy button {
            background-color: #aa6f73;
            width: 6rem;
            transition: background-color 0.3s ease;
        }
        .Card button {
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .Card .AddToCart button:hover {
            background-color: #a39193;
        }
        .Card .buy button:hover {
            background-color: #a39193;
        }
    </style>
</head>
